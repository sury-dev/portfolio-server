[SERVER]
# The host to listen on. Default: 0.0.0.0. Override with SERVER_HOST.
HOST = 0.0.0.0
# The port to listen on. Default: 8080. Override with SERVER_PORT.
PORT = 8080
# The name of the server. Default: Portfolio Server. Override with SERVER_NAME.
NAME = "Portfolio Server"
# The time to wait for the server to shut down gracefully, in seconds.
# Default: 10. Override with SERVER_SHUTDOWN_TIMEOUT_SEC.
SHUTDOWN_TIMEOUT_SEC = 10

[LOGGING]
# Optional. Default: info. Allowed: debug, info, warning, error. Override with LOGGING_LEVEL.
LEVEL = info
# Optional. Default: json. Allowed: json, text. Override with LOGGING_FORMAT.
FORMAT = json
# Optional. Default: stdout. Allowed: stdout, stderr, or a file path. Override with LOGGING_OUTPUT.
OUTPUT = stdout

[DATABASE]
# The host of the database. Default: 0.0.0.0. Override with DATABASE_HOST.
HOST = 127.0.0.1
# The port of the database. Default: 5432. Override with DATABASE_PORT.
PORT = 5432
# The name of the database. Default: portfolio. Override with DATABASE_NAME.
NAME = portfolio
# The user of the database. Default: surydev. Override with DATABASE_USER.
USER = surydev
# The password of the database. Default: sury123. Override with DATABASE_PASSWORD.
PASSWORD = ...
# The SSL mode of the database. Default: disable. Override with DATABASE_SSL_MODE.
SSL_MODE = disable